name: chart-repo

# Package the Helm chart, create a chart release, and update the Helm repository
# index on the gh-pages branch. GitHub Pages serves that branch at
# https://jawaracloud.github.io/skopos/.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chart-repo
  cancel-in-progress: false

jobs:
  publish:
    name: Publish Helm chart repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: v3.22.1

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@92c6b97fa9f664492a2592e0d1d80bc6bf378957 # v1.9.0
        with:
          version: v1.10.0
          charts_dir: deploy/helm
          packages_with_index: true
          skip_existing: true
          pages_branch: gh-pages
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CR_GENERATE_RELEASE_NOTES: "true"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # v2.6.0 still supports the stable --tlog-upload flag. The v3 signing
          # config path hit a Rekor equivalent-entry conflict for this package.
          cosign-release: v2.6.0

      - name: Sign chart release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          version="$(awk '/^version:/{print $2; exit}' deploy/helm/skopos/Chart.yaml)"
          package=".cr-release-packages/skopos-${version}.tgz"
          signature="${package}.sig"
          certificate="${package}.pem"

          if ! gh release view "skopos-${version}" >/dev/null 2>&1; then
            echo "chart release skopos-${version} does not exist; nothing to sign" >&2
            exit 1
          fi
          if gh release view "skopos-${version}" --json assets \
            --jq '.assets[].name' | grep -qx "skopos-${version}.tgz.sig"; then
            echo "chart signature already present"
            exit 0
          fi
          if [ ! -f "$package" ]; then
            mkdir -p .cr-release-packages
            gh release download "skopos-${version}" \
              --pattern "skopos-${version}.tgz" \
              --dir .cr-release-packages
          fi
          # Keyless Fulcio certificate plus a detached signature. Skip the
          # transparency log to avoid a duplicate-entry conflict when this
          # workflow is re-run for an already-published package.
          cosign sign-blob --yes \
            --tlog-upload=false \
            --output-signature "$signature" \
            --output-certificate "$certificate" \
            "$package"
          gh release upload "skopos-${version}" "$signature" "$certificate" --clobber
