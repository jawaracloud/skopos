name: scorecard-ghas

# Optional path for the official ossf/scorecard-action.
#
# Prerequisites:
#   1. Enable GitHub Advanced Security (or make the repository public).
#   2. Set the repository variable ENABLE_GHAS_SCORECARD=true.
#   3. Run this workflow manually from the Actions tab.
#
# Without the variable the job is skipped, so this workflow never fails normal
# CI because GHAS is absent. It is manual-only on purpose; the CLI workflow in
# scorecard.yml is the default private-repository path.
#
# publish_results is false: this is a private repository, and the public
# Scorecard API/badge must not receive private-repository results.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scorecard:
    name: Official Scorecard action (GHAS only)
    if: vars.ENABLE_GHAS_SCORECARD == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      issues: read
      pull-requests: read
      checks: read
      security-events: write
      # Add id-token: write only if publish_results is changed to true.
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run official Scorecard action
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: false

      - name: Upload SARIF artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif-${{ github.run_id }}-${{ github.run_attempt }}
          path: results.sarif
          if-no-files-found: warn
          retention-days: 1

      - name: Upload SARIF to code scanning
        if: success()
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          sarif_file: results.sarif
