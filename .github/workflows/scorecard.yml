name: scorecard

# Public repository path: run the official OpenSSF Scorecard action and publish
# the result to the public Scorecard API. The CLI fallback in
# scripts/scorecard.sh remains available for local scans.
#
# The action needs no GHAS on a public repository. It writes SARIF to code
# scanning and publishes the score/badge data under the repository's public
# identity.

on:
  branch_protection_rule:
  schedule:
    # Weekly. Offset from the top of the hour to avoid the busiest API window.
    - cron: "17 3 * * 1"
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: OpenSSF Scorecard
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
          # Optional fine-grained PAT with Administration: read-only. Without
          # it, the action uses GITHUB_TOKEN and the Branch-Protection check
          # reports an internal error because that token cannot read classic
          # branch protection rules. Uncomment after creating the secret.
          # repo_token: ${{ secrets.SCORECARD_TOKEN }}

      - name: Upload SARIF artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif-${{ github.run_id }}-${{ github.run_attempt }}
          path: results.sarif
          if-no-files-found: warn
          retention-days: 1

      - name: Upload SARIF to code scanning
        if: success()
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          sarif_file: results.sarif
