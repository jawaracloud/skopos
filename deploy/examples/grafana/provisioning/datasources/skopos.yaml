# Example Grafana datasource provisioning for Skopos.
#
# Replace the namespace/service if you installed the chart with a different
# release name or namespace. The three alpha query heads are implemented; see
# docs/promql-support.md, docs/traceql-support.md, and docs/logql-support.md for
# the supported subset. Unsupported queries return explicit errors.
#
# If auth.enabled=true in the chart, enable basicAuth on each datasource and
# set basicAuthUser plus secureJsonData.basicAuthPassword from the same Secret.
# Do not commit the password.
apiVersion: 1

datasources:
  - name: Skopos Prometheus
    type: prometheus
    uid: skopos-prometheus
    access: proxy
    url: http://skopos-gateway.observability.svc:8080
    isDefault: false
    jsonData:
      httpMethod: POST
      timeInterval: 30s

  - name: Skopos Loki
    type: loki
    uid: skopos-loki
    access: proxy
    url: http://skopos-gateway.observability.svc:8080
    jsonData:
      maxLines: 1000

  - name: Skopos Tempo
    type: tempo
    uid: skopos-tempo
    access: proxy
    url: http://skopos-gateway.observability.svc:8080
    jsonData:
      httpMethod: GET
      tracesToLogsV2:
        datasourceUid: skopos-loki
      serviceMap:
        datasourceUid: skopos-prometheus
