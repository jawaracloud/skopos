{{- if .Values.clickhouse.backup.enabled }}
{{- $backup := .Values.clickhouse.backup }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "skopos.clickhouseBackup.fullname" . }}
  labels:
    {{- include "skopos.labels" . | nindent 4 }}
    app.kubernetes.io/component: clickhouse-backup
spec:
  schedule: {{ $backup.schedule | quote }}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: {{ $backup.startingDeadlineSeconds }}
  successfulJobsHistoryLimit: {{ $backup.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ $backup.failedJobsHistoryLimit }}
  jobTemplate:
    metadata:
      labels:
        {{- include "skopos.labels" . | nindent 8 }}
        app.kubernetes.io/component: clickhouse-backup
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: {{ $backup.activeDeadlineSeconds }}
      template:
        metadata:
          labels:
            {{- include "skopos.labels" . | nindent 12 }}
            app.kubernetes.io/component: clickhouse-backup
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: backup
              image: {{ include "skopos.image" (dict "image" $backup.image) | quote }}
              imagePullPolicy: {{ $backup.image.pullPolicy }}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              command:
                - /bin/bash
                - -ec
              args:
                - |
                  export HOME=/tmp

                  sql_escape() {
                    local value="$1"
                    value="${value//\\/\\\\}"
                    value="${value//\'/\'\'}"
                    printf '%s' "$value"
                  }

                  timestamp="$(date -u +%Y%m%dT%H%M%SZ)"
                  destination="${S3_ENDPOINT%/}/${S3_BUCKET}/${S3_PREFIX}/${SKOPOS_DATABASE}/${timestamp}"

                  query="BACKUP DATABASE \`${SKOPOS_DATABASE}\` TO S3('$(sql_escape "$destination")', '$(sql_escape "$S3_ACCESS_KEY_ID")', '$(sql_escape "$S3_SECRET_ACCESS_KEY")')"

                  echo "backup: ${destination}"
                  clickhouse-client \
                    --host "$CLICKHOUSE_HOST" \
                    --port "$CLICKHOUSE_PORT" \
                    --user "$CLICKHOUSE_ADMIN_USER" \
                    --password "$CLICKHOUSE_ADMIN_PASSWORD" \
                    --query "$query"
              env:
                - name: TZ
                  value: UTC
                - name: CLICKHOUSE_HOST
                  value: {{ include "skopos.clickhouse.host" . | quote }}
                - name: CLICKHOUSE_PORT
                  value: {{ .Values.clickhouse.service.nativePort | int64 | quote }}
                - name: CLICKHOUSE_ADMIN_USER
                  value: {{ .Values.clickhouse.auth.adminUser | quote }}
                - name: CLICKHOUSE_ADMIN_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "skopos.clickhouse.secretName" . }}
                      key: admin-password
                - name: SKOPOS_DATABASE
                  value: {{ .Values.clickhouse.database | quote }}
                - name: S3_ENDPOINT
                  value: {{ $backup.endpoint | quote }}
                - name: S3_BUCKET
                  value: {{ trimSuffix "/" $backup.bucket | quote }}
                - name: S3_PREFIX
                  value: {{ trimSuffix "/" $backup.prefix | quote }}
                - name: S3_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "skopos.clickhouse.backupSecretName" . }}
                      key: access-key-id
                - name: S3_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "skopos.clickhouse.backupSecretName" . }}
                      key: secret-access-key
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir: {}
{{- end }}
