{{- if and .Values.checkpoint.enabled (not .Values.checkpoint.s3.existingSecret) (or .Values.checkpoint.s3.accessKeyId .Values.checkpoint.s3.secretAccessKey) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "skopos.checkpoint.secretName" . }}
  labels:
    {{- include "skopos.labels" . | nindent 4 }}
    app.kubernetes.io/component: checkpoint
type: Opaque
stringData:
  access-key-id: {{ .Values.checkpoint.s3.accessKeyId | quote }}
  secret-access-key: {{ .Values.checkpoint.s3.secretAccessKey | quote }}
  {{- if .Values.checkpoint.s3.sessionToken }}
  session-token: {{ .Values.checkpoint.s3.sessionToken | quote }}
  {{- end }}
{{- end }}
