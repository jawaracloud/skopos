{{- if and .Values.clickhouse.storage.enabled (not .Values.clickhouse.storage.cold.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "skopos.clickhouse.storageSecretName" . }}
  labels:
    {{- include "skopos.labels" . | nindent 4 }}
    app.kubernetes.io/component: clickhouse
type: Opaque
stringData:
  access-key-id: {{ .Values.clickhouse.storage.cold.accessKeyId | quote }}
  secret-access-key: {{ .Values.clickhouse.storage.cold.secretAccessKey | quote }}
{{- end }}
{{- if and .Values.clickhouse.backup.enabled (not .Values.clickhouse.backup.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "skopos.clickhouse.backupSecretName" . }}
  labels:
    {{- include "skopos.labels" . | nindent 4 }}
    app.kubernetes.io/component: clickhouse-backup
type: Opaque
stringData:
  access-key-id: {{ .Values.clickhouse.backup.accessKeyId | quote }}
  secret-access-key: {{ .Values.clickhouse.backup.secretAccessKey | quote }}
{{- end }}
