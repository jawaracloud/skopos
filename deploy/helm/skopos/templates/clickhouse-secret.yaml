{{- if not .Values.clickhouse.auth.existingSecret }}
{{- $secretName := printf "%s-clickhouse-credentials" (include "skopos.fullname" .) | trunc 63 | trimSuffix "-" }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $admin := randAlphaNum 32 }}
{{- $gateway := randAlphaNum 32 }}
{{- if $existing }}
{{- with (index $existing.data "admin-password") }}{{ $admin = . | b64dec }}{{ end }}
{{- with (index $existing.data "gateway-password") }}{{ $gateway = . | b64dec }}{{ end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "skopos.labels" . | nindent 4 }}
    app.kubernetes.io/component: clickhouse
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  admin-password: {{ $admin | b64enc | quote }}
  gateway-password: {{ $gateway | b64enc | quote }}
{{- end }}
