apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "skopos.clickhouse.fullname" . }}
  labels:
    {{- include "skopos.labels" . | nindent 4 }}
    app.kubernetes.io/component: clickhouse
spec:
  serviceName: {{ include "skopos.clickhouse.fullname" . }}
  replicas: 1
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      {{- include "skopos.componentLabels" (dict "root" . "component" "clickhouse") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "skopos.labels" . | nindent 8 }}
        app.kubernetes.io/component: clickhouse
      annotations:
        checksum/schema: {{ include (print $.Template.BasePath "/clickhouse-schema-configmap.yaml") . | sha256sum | quote }}
        {{- if .Values.clickhouse.storage.enabled }}
        checksum/storage: {{ include (print $.Template.BasePath "/clickhouse-storage-configmap.yaml") . | sha256sum | quote }}
        {{- end }}
    spec:
      securityContext:
        {{- toYaml .Values.clickhouse.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: 60
      containers:
        - name: clickhouse
          image: {{ include "skopos.image" (dict "image" .Values.clickhouse.image) | quote }}
          imagePullPolicy: {{ .Values.clickhouse.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.clickhouse.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.clickhouse.service.httpPort }}
              protocol: TCP
            - name: native
              containerPort: {{ .Values.clickhouse.service.nativePort }}
              protocol: TCP
          env:
            - name: CLICKHOUSE_DB
              value: {{ .Values.clickhouse.database | quote }}
            - name: CLICKHOUSE_USER
              value: {{ .Values.clickhouse.auth.adminUser | quote }}
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "skopos.clickhouse.secretName" . }}
                  key: admin-password
            - name: CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT
              value: "1"
            # The exporter stores time as epoch-based DateTime/DateTime64 values.
            # Keeping the server and client in UTC makes parameterized ranges
            # unambiguous.
            - name: TZ
              value: UTC
            {{- if .Values.clickhouse.storage.enabled }}
            - name: CLICKHOUSE_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "skopos.clickhouse.storageSecretName" . }}
                  key: access-key-id
            - name: CLICKHOUSE_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "skopos.clickhouse.storageSecretName" . }}
                  key: secret-access-key
            {{- end }}
            {{- with .Values.clickhouse.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          startupProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          resources:
            {{- toYaml .Values.clickhouse.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/clickhouse
            - name: logs
              mountPath: /var/log/clickhouse-server
            - name: tmp
              mountPath: /tmp
            - name: var-run
              mountPath: /var/run/clickhouse-server
            {{- if .Values.clickhouse.storage.enabled }}
            - name: storage-config
              mountPath: /etc/clickhouse-server/config.d/10-storage.xml
              subPath: 10-storage.xml
              readOnly: true
            {{- end }}
      volumes:
        - name: logs
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: var-run
          emptyDir: {}
        {{- if .Values.clickhouse.storage.enabled }}
        - name: storage-config
          configMap:
            name: {{ include "skopos.clickhouse.fullname" . }}-storage
        {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "skopos.labels" . | nindent 10 }}
          app.kubernetes.io/component: clickhouse
      spec:
        accessModes:
          {{- toYaml .Values.clickhouse.persistence.accessModes | nindent 10 }}
        {{- if .Values.clickhouse.persistence.storageClass }}
        storageClassName: {{ .Values.clickhouse.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.clickhouse.persistence.size }}
