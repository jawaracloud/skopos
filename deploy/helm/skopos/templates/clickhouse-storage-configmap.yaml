{{- if .Values.clickhouse.storage.enabled }}
{{- $storage := .Values.clickhouse.storage }}
{{- $cold := $storage.cold }}
{{- $endpoint := trimSuffix "/" $cold.endpoint }}
{{- $bucket := trimSuffix "/" $cold.bucket }}
{{- $prefix := trimSuffix "/" $cold.prefix }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "skopos.clickhouse.fullname" . }}-storage
  labels:
    {{- include "skopos.labels" . | nindent 4 }}
    app.kubernetes.io/component: clickhouse
data:
  10-storage.xml: |
    <clickhouse>
        <storage_configuration>
            <disks>
                <{{ $storage.hotVolume }}>
                    <type>local</type>
                    <path>/var/lib/clickhouse/disks/{{ $storage.hotVolume }}/</path>
                </{{ $storage.hotVolume }}>
                <cold_s3>
                    <type>s3</type>
                    <endpoint>{{ printf "%s/%s/%s/" $endpoint $bucket $prefix | html }}</endpoint>
                    {{- with $cold.region }}
                    <region>{{ . | html }}</region>
                    {{- end }}
                    <access_key_id from_env="CLICKHOUSE_S3_ACCESS_KEY_ID"/>
                    <secret_access_key from_env="CLICKHOUSE_S3_SECRET_ACCESS_KEY"/>
                </cold_s3>
                <{{ $storage.coldVolume }}>
                    <type>cache</type>
                    <disk>cold_s3</disk>
                    <path>/var/lib/clickhouse/disks/{{ $storage.coldVolume }}_cache/</path>
                    <max_size>{{ $storage.cacheSize }}</max_size>
                </{{ $storage.coldVolume }}>
            </disks>
            <policies>
                <tiered>
                    <volumes>
                        <{{ $storage.hotVolume }}>
                            <disk>{{ $storage.hotVolume }}</disk>
                        </{{ $storage.hotVolume }}>
                        {{- /*
                        The built-in default volume is required so that
                        ALTER TABLE ... MODIFY SETTING storage_policy='tiered'
                        is accepted on tables that still use the default policy.
                        New tables use the hot volume because it is first.
                        */}}
                        <default>
                            <disk>default</disk>
                        </default>
                        <{{ $storage.coldVolume }}>
                            <disk>{{ $storage.coldVolume }}</disk>
                        </{{ $storage.coldVolume }}>
                    </volumes>
                </tiered>
            </policies>
        </storage_configuration>
    </clickhouse>
{{- end }}
