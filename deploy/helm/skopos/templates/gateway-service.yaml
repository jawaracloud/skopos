{{- if .Values.gateway.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "skopos.gateway.fullname" . }}
  labels:
    {{- include "skopos.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  type: {{ .Values.gateway.service.type }}
  selector:
    {{- if .Values.distributed.enabled }}
    {{- include "skopos.componentLabels" (dict "root" . "component" "frontend") | nindent 4 }}
    {{- else }}
    {{- include "skopos.componentLabels" (dict "root" . "component" "gateway") | nindent 4 }}
    {{- end }}
  ports:
    - name: http
      port: {{ .Values.gateway.service.port }}
      targetPort: http
      protocol: TCP
      appProtocol: http
{{- end }}
