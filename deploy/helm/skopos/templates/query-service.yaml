{{- if and .Values.gateway.enabled .Values.distributed.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "skopos.query.fullname" . }}
  labels:
    {{- include "skopos.labels" . | nindent 4 }}
    app.kubernetes.io/component: query
spec:
  type: {{ .Values.query.service.type }}
  selector:
    {{- include "skopos.componentLabels" (dict "root" . "component" "query") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.query.service.port }}
      targetPort: http
      protocol: TCP
      appProtocol: http
{{- end }}
