name: skopos-bench

services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.8.36.3@sha256:d426d2f612e1e189c90f9a3f8dcd85a03c6851273833817a296bb327e63aa7a7
    environment:
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 3s
      timeout: 5s
      retries: 40
    volumes:
      - bench-clickhouse-data:/var/lib/clickhouse
    ports:
      - "${SKOPOS_BENCH_CLICKHOUSE_HTTP_PORT:-18124}:8123"
      - "${SKOPOS_BENCH_CLICKHOUSE_NATIVE_PORT:-19001}:9000"

  clickhouse-init:
    image: clickhouse/clickhouse-server:26.8.36.3@sha256:d426d2f612e1e189c90f9a3f8dcd85a03c6851273833817a296bb327e63aa7a7
    depends_on:
      clickhouse:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/init/init-clickhouse.sh"]
    environment:
      CLICKHOUSE_ADMIN_USER: default
      CLICKHOUSE_ADMIN_PASSWORD: ""
      SKOPOS_DATABASE: otel
      SKOPOS_GATEWAY_USER: skopos_gateway
      SKOPOS_GATEWAY_PASSWORD: ${SKOPOS_BENCH_GATEWAY_PASSWORD:-skopos-bench-password}
    volumes:
      - ../e2e/obi/.render/schema.sql:/schema/schema.sql:ro
      - ../e2e/obi/.render/migrate.sh:/schema/migrate.sh:ro
      - ../e2e/obi/init-clickhouse.sh:/init/init-clickhouse.sh:ro
    restart: "no"

  gateway:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        VERSION: bench
    depends_on:
      clickhouse-init:
        condition: service_completed_successfully
    environment:
      SKOPOS_LISTEN_ADDR: ":8080"
      SKOPOS_CLICKHOUSE_URL: http://clickhouse:8123
      SKOPOS_CLICKHOUSE_DATABASE: otel
      SKOPOS_CLICKHOUSE_USER: skopos_gateway
      SKOPOS_CLICKHOUSE_PASSWORD: ${SKOPOS_BENCH_GATEWAY_PASSWORD:-skopos-bench-password}
      SKOPOS_LOG_LEVEL: warn
    ports:
      - "${SKOPOS_BENCH_GATEWAY_PORT:-28082}:8080"

volumes:
  bench-clickhouse-data:
