receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

exporters:
  clickhouse:
    endpoint: tcp://clickhouse:9000
    database: otel
    username: default
    password: ""
    create_schema: false
    async_insert: true
    ttl: 0s
    logs_table_name: otel_logs
    traces_table_name: otel_traces
    metrics_tables:
      gauge:
        name: otel_metrics_gauge
      sum:
        name: otel_metrics_sum
      summary:
        name: otel_metrics_summary
      histogram:
        name: otel_metrics_histogram
      exponential_histogram:
        name: otel_metrics_exponential_histogram
    timeout: 5s
    sending_queue:
      enabled: true
      num_consumers: 10
      queue_size: 50000
      sizer: items
      batch:
        min_size: 5000
        flush_timeout: 5s
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s

service:
  extensions:
    - health_check
  pipelines:
    traces:
      receivers:
        - otlp
      exporters:
        - clickhouse
    metrics:
      receivers:
        - otlp
      exporters:
        - clickhouse
    logs:
      receivers:
        - otlp
      exporters:
        - clickhouse
  telemetry:
    logs:
      level: info
      encoding: json
    metrics:
      level: basic
