name: skopos-obi-e2e

services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.8.36.3@sha256:d426d2f612e1e189c90f9a3f8dcd85a03c6851273833817a296bb327e63aa7a7
    environment:
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 3s
      timeout: 5s
      retries: 40
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    ports:
      - "${SKOPOS_E2E_CLICKHOUSE_HTTP_PORT:-18123}:8123"
      - "${SKOPOS_E2E_CLICKHOUSE_NATIVE_PORT:-19000}:9000"

  clickhouse-init:
    image: clickhouse/clickhouse-server:26.8.36.3@sha256:d426d2f612e1e189c90f9a3f8dcd85a03c6851273833817a296bb327e63aa7a7
    depends_on:
      clickhouse:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/init/init-clickhouse.sh"]
    environment:
      CLICKHOUSE_ADMIN_USER: default
      CLICKHOUSE_ADMIN_PASSWORD: ""
      SKOPOS_DATABASE: otel
      SKOPOS_GATEWAY_USER: skopos_gateway
      SKOPOS_GATEWAY_PASSWORD: ${SKOPOS_E2E_GATEWAY_PASSWORD:-skopos-e2e-password}
    volumes:
      - ./.render/schema.sql:/schema/schema.sql:ro
      - ./.render/migrate.sh:/schema/migrate.sh:ro
      - ./init-clickhouse.sh:/init/init-clickhouse.sh:ro
    restart: "no"

  collector:
    image: otel/opentelemetry-collector-contrib:0.164.0@sha256:340c9ca6a36617084c6661bdc4f0fe92b7cda5a805d61673ec8db375fddc522b
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    depends_on:
      clickhouse-init:
        condition: service_completed_successfully
    volumes:
      - ./collector-config.yml:/etc/otelcol-contrib/config.yaml:ro
    expose:
      - "4317"
      - "4318"
      - "13133"

  app:
    build:
      context: ./app
    ports:
      - "${SKOPOS_E2E_APP_PORT:-18080}:8080"

  obi:
    image: otel/ebpf-instrument:v1.0.0@sha256:a68d70e934260f72540f157ccf4fb4adfa38f11de060d7d905696dad6a3fca02
    pid: host
    privileged: true
    read_only: true
    depends_on:
      collector:
        condition: service_started
      app:
        condition: service_started
    environment:
      OTEL_EBPF_CONFIG_PATH: /config/obi-config.yml
      OTEL_EBPF_KUBE_METADATA_ENABLE: "false"
    volumes:
      - ./obi-config.yml:/config/obi-config.yml:ro
      - ${SKOPOS_E2E_TRACEFS:-/sys/kernel/tracing}:/sys/kernel/tracing
      - ${SKOPOS_E2E_CGROUPFS:-/sys/fs/cgroup}:/sys/fs/cgroup
    tmpfs:
      - /var/run/obi
      - /tmp

  gateway:
    build:
      context: ../../..
      dockerfile: Dockerfile
      args:
        VERSION: e2e
    depends_on:
      clickhouse-init:
        condition: service_completed_successfully
    environment:
      # Keep the gateway off port 8080: OBI selects the instrumented workload by
      # internal port, and with hostPID it can observe every container listening
      # on the selected port. The app owns 8080 in this harness.
      SKOPOS_LISTEN_ADDR: ":18081"
      SKOPOS_CLICKHOUSE_URL: http://clickhouse:8123
      SKOPOS_CLICKHOUSE_DATABASE: otel
      SKOPOS_CLICKHOUSE_USER: skopos_gateway
      SKOPOS_CLICKHOUSE_PASSWORD: ${SKOPOS_E2E_GATEWAY_PASSWORD:-skopos-e2e-password}
      SKOPOS_LOG_LEVEL: info
    ports:
      - "${SKOPOS_E2E_GATEWAY_PORT:-18081}:18081"

volumes:
  clickhouse-data:
